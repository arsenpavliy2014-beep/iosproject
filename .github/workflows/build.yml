name: Build ImGui for iOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install ant
        run: brew install ant

      - name: Clone imgui-java 1.90.0
        run: |
          git clone --recursive https://github.com/SpaiR/imgui-java.git imgui-java
          cd imgui-java
          git checkout 1.90.0 || echo "tag not found, using default branch"
          git submodule update --init --recursive
          git log -1 --oneline

      - name: Generate JNI sources
        working-directory: imgui-java
        run: ./gradlew :imgui-binding:generateLibs -Denvs=macosarm64 -Dlocal --no-daemon --console=plain

      - name: Build iOS dylib
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          LOG="$GITHUB_WORKSPACE/out/ios-build.log"

          # 1. remove the macOS dylib produced by the generate step
          find "$GITHUB_WORKSPACE/imgui-java" -name "libimgui-java64.dylib" -print -delete

          # 2. find the generated Ant script
          XML=$(find "$GITHUB_WORKSPACE/imgui-java/imgui-binding/build/jni" -maxdepth 1 -name "build-macosxarm64.xml" | head -1)
          echo "XML=$XML"
          test -n "$XML"
          cp "$XML" "$GITHUB_WORKSPACE/out/build-macosxarm64.xml.orig"

          # 3. point compiler/linker flags at the iPhoneOS SDK
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          python3 - "$XML" "$SDK" <<'PY'
          import sys, re
          path, sdk = sys.argv[1], sys.argv[2]
          t = open(path, encoding='utf-8', errors='surrogateescape').read()
          t = re.sub(r'-mmacosx-version-min=[0-9.]+', '', t)
          flags = f'-target arm64-apple-ios14.0 -isysroot {sdk}'
          t, n = re.subn(r'-arch arm64', f'-arch arm64 {flags}', t)
          print('patched places:', n)
          open(path, 'w', encoding='utf-8', errors='surrogateescape').write(t)
          PY
          cp "$XML" "$GITHUB_WORKSPACE/out/build-macosxarm64.xml"

          # 4. build with the patched script
          cd "$(dirname "$XML")"
          ant -f "$(basename "$XML")" -v -Dhas-compiler=true -Drelease=true clean postcompile 2>&1 | tee "$LOG"

          # 5. verify: must be iOS, arm64 only
          DYLIB="$GITHUB_WORKSPACE/imgui-java/imgui-binding/build/libsNative/macosxarm64/libimgui-java64.dylib"
          if [ ! -f "$DYLIB" ]; then
            DYLIB=$(find "$GITHUB_WORKSPACE/imgui-java" -name "libimgui-java64.dylib" | head -1)
          fi
          echo "DYLIB=$DYLIB"
          test -n "$DYLIB" && test -f "$DYLIB"
          lipo -info "$DYLIB" | tee "$GITHUB_WORKSPACE/out/platform.txt"
          otool -l "$DYLIB" | grep -A4 LC_BUILD_VERSION | tee -a "$GITHUB_WORKSPACE/out/platform.txt"
          otool -l "$DYLIB" | grep -q "platform 2" || { echo "NOT an iOS build (platform 2 missing)"; exit 1; }
          cp "$DYLIB" "$GITHUB_WORKSPACE/out/libimgui-java64.dylib"

      - name: Save dylib into repo (ios-build/)
        if: success()
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p ios-build
          cp out/libimgui-java64.dylib out/platform.txt ios-build/
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add ios-build
          git commit -m "iOS dylib build" || echo "nothing to commit"
          git push

      - name: Collect logs
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$GITHUB_WORKSPACE/imgui-java/imgui-binding/build/jni/build-macosxarm64.xml" "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imgui-ios
          path: out/
